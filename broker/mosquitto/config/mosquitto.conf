# Mosquitto 2.x configuration for development.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Same users and ACLs on every listener
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plain MQTT. docker-compose only publishes this port on 127.0.0.1.
listener 1883

# MQTT over TLS (self-signed CA from make-certs.sh)
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
